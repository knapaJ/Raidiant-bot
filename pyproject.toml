[project]
name = "wowbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jknapovsky", email = "jknapovsky@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "py-cord>=2.8.1",
]

[project.scripts]
wowbot = "wowbot:main"

[project.optional-dependencies]
sentry = [
    "sentry-sdk>=2.72.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
